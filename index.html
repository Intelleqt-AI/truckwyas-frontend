    <meta name="twitter:image" content="/brand/logo.png" />
    <script>
      /* Apply the saved theme before first paint so logged-out pages (login,
         signup, reset) follow the same light/dark choice as the app and no
         page flashes the wrong theme. OSLayout keeps it in sync after login. */
      try {
        var t = localStorage.getItem('tw-theme');
        if (t === 'light' || t === 'dark') document.documentElement.setAttribute('data-theme', t);
      } catch (e) {}
    </script>
  </head>

  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
